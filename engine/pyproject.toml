[project]
name = "dublador"
version = "0.1.0"
description = "Motor local de dublagem de vídeos do YouTube para pt-BR"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp[default,curl-cffi]",
    "fastapi",
    "uvicorn",
    "numpy",
    "soundfile",
    "soxr",
    "pyloudnorm",
    "audio-separator[cpu]>=0.47.0",
    "kokoro-onnx>=0.6.1",
    "audioread>=3.1.0",
]

[project.scripts]
dub = "dublador.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dublador"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
